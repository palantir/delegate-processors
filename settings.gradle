buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.palantir.gradle.jdks:gradle-jdks-settings:0.75.0'
    }
}
apply plugin: 'com.palantir.jdks.settings'
rootProject.name = 'delegate-processors-root'

include 'delegate-processor'
project(':delegate-processor').projectDir = file('delegate-processors')
